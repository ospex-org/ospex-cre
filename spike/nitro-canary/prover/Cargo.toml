[package]
name = "nitro-zk-prove"
version = "0.1.0"
edition = "2021"
publish = false

# Runs Automata's committed RISC Zero guest (aws-nitro-enclave-attestation at 65c4a42,
# crates/risc0-methods/elf/risc0-verifier.elf) on one attestation and writes the journal and
# a Groth16 seal in the form RiscZeroGroth16Verifier.verify takes (4-byte selector + seal).
# Same risc0-zkvm version as that commit's Cargo.lock.
[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["prove"] }
anyhow = "1"
hex = "0.4"

[profile.release]
opt-level = 3
