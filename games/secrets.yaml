# The games workflow's secrets: one key per seat of the scoring program's feed table, named by seat.
# Simulation reads each value from the matching env var (a gitignored .env or the shell); deployment
# uploads it to the Vault DON under the workflow owner with `cre secrets create`. No value lives here.
secretsNames:
  SEAT1_KEY:
    - SEAT1_KEY
  SEAT2_KEY:
    - SEAT2_KEY
  SEAT3_KEY:
    - SEAT3_KEY
  SEAT4_KEY:
    - SEAT4_KEY
