# The games workflow's secrets: one key per seat of the scoring program's feed table, named by seat.
# Simulation reads each value from the matching env var (a gitignored .env or the shell); deployment
# uploads it to the Vault DON under the workflow owner with `cre secrets create`. No value lives here.
secretsNames:
  SEAT1_KEY:
    - SEAT1_KEY
  SEAT2_KEY:
    - SEAT2_KEY
  SEAT3_KEY:
    - SEAT3_KEY
  SEAT4_KEY:
    - SEAT4_KEY
# The run-line's push key: the database role that may only add rows to the run-line table and read
# its two key columns. The enclave fills it into the push's Authorization header; the workflow never
# holds it. Simulation reads a stand-in from the env var; it is never a project-wide database key.
  RUN_LINE_KEY:
    - RUN_LINE_KEY
